[project]
name = "vibe-buddy"
version = "0.1.0"
description = "PC-side BLE bridge, hooks, and Agent Hub for StickS3 Vibe Buddy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "codex-buddy contributors" }]
keywords = ["stick", "ble", "codex", "agent-hub", "vibe-buddy"]
dependencies = [
  "bleak>=0.22",
]

[project.optional-dependencies]
translate = [
  "argostranslate>=1.9",
  "pypinyin>=0.51",
]
dev = [
  "vibe-buddy[translate]",
]

[project.scripts]
vibe-buddy = "vibe_buddy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
